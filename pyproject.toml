[project]
name = "t-bank-invest-mcp-read-only"
version = "0.1.0"
description = "MCP server for reading T-Bank (Tinkoff) investment portfolio data"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
    "certifi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbank_invest_mcp"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
t-bank-invest-mcp-read-only = "tbank_invest_mcp.server:main"
