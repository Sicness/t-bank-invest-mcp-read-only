name: Release

# Pushing a tag vX.Y.Z builds the package, tests the built wheel, publishes it
# to PyPI, creates a GitHub Release with the same files and, for a final
# version, lists it in the MCP Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history, to check where the tag sits

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A tag can be pushed from any branch or a detached commit; only what has
      # landed on main gets published.
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Push main first."
            exit 1
          fi

      - name: Check that the tag matches the package version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A dev, alpha, beta or rc version must not become the "Latest" release
          # nor the version the MCP Registry offers.
          if [[ "$version" =~ (a|b|rc|dev)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      # Test what users will install, not the checkout: this catches files
      # (the pinned CA certificate) missing from the wheel.
      - name: Test the built wheel
        run: |
          pip install dist/*.whl pytest pytest-asyncio
          pytest --tb=short -q -x

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/t-bank-invest-mcp-read-only/
    permissions:
      id-token: write  # PyPI Trusted Publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"

  # The registry checks that the package on PyPI is ours: its description (the
  # README) carries "mcp-name: <the name in server.json>".
  mcp-registry:
    needs: [build, pypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write  # GitHub OIDC login to the registry, no token stored
    steps:
      - uses: actions/checkout@v7

      - name: Set the released version in server.json
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.new
          mv server.json.new server.json

      - name: Wait until PyPI serves the new version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 30); do
            curl -sf "https://pypi.org/pypi/t-bank-invest-mcp-read-only/$VERSION/json" > /dev/null && exit 0
            sleep 10
          done
          echo "::error::PyPI does not serve version $VERSION after 5 minutes"
          exit 1

      - name: Publish to the MCP Registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
