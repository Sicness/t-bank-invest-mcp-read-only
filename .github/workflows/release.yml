name: Release

# Pushing a tag vX.Y.Z builds the package, tests the built wheel, publishes it
# to PyPI and creates a GitHub Release with the same files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      # Test what users will install, not the checkout: this catches files
      # (the pinned CA certificate) missing from the wheel.
      - name: Test the built wheel
        run: |
          pip install dist/*.whl pytest pytest-asyncio
          pytest --tb=short -q -x

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/t-bank-invest-mcp-read-only/
    permissions:
      id-token: write  # PyPI Trusted Publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
